name: Apply position identity consistency once

on:
  push:
    branches: [ fix/position-identity-consistency-v2 ]
    paths:
      - 'scripts/apply-strict-position-identity-links.mjs'
      - 'scripts/verify-position-locked-player-identity.mjs'
      - '.github/workflows/apply-position-identity-consistency-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/position-identity-consistency-v2
          fetch-depth: 0
      - run: node scripts/apply-strict-position-identity-links.mjs
      - run: node scripts/verify-position-locked-player-identity.mjs
      - shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/services/fplPlayerIdentity.ts server/services/apiFootballPlayerDirectory.ts client/src/components/cards/PremiumFootballCard.tsx scripts/reconcile-owned-premier-league-cards.mjs
          git commit -m 'Lock player identity consistency across all card surfaces'
          git push origin HEAD:fix/position-identity-consistency-v2
