name: Notification delivery regression
on:
  push:
    branches: [main]
    paths: ['server/services/*Push.ts', 'server/services/pushBatching.ts', 'server/services/notificationHealth.ts', 'server/routes/notifications.routes.ts', 'client/src/lib/notification-toast-policy.ts', 'client/src/components/FloatingEventNotifications.tsx', 'scripts/test-push-batching.cjs', '.github/workflows/notification-delivery-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: notification_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-push-batching.cjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@localhost:5432/notification_test
