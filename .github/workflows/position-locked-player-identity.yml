name: Position Locked Player Identity

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'server/services/fplPlayerIdentity.ts'
      - 'server/services/apiFootballPlayerDirectory.ts'
      - 'client/src/components/cards/PremiumFootballCard.tsx'
      - 'scripts/reconcile-owned-premier-league-cards.mjs'
      - 'scripts/apply-strict-position-identity-links.mjs'
      - 'scripts/verify-position-locked-player-identity.mjs'
      - '.github/workflows/position-locked-player-identity.yml'
  push:
    branches: [ main ]
    paths:
      - 'server/services/fplPlayerIdentity.ts'
      - 'server/services/apiFootballPlayerDirectory.ts'
      - 'client/src/components/cards/PremiumFootballCard.tsx'
      - 'scripts/reconcile-owned-premier-league-cards.mjs'
      - 'scripts/apply-strict-position-identity-links.mjs'
      - 'scripts/verify-position-locked-player-identity.mjs'
      - '.github/workflows/position-locked-player-identity.yml'
  workflow_dispatch:

jobs:
  position-identity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed source is position locked
        run: node scripts/verify-position-locked-player-identity.mjs
      - name: Prove repair is idempotent
        run: |
          node scripts/apply-strict-position-identity-links.mjs
          node scripts/verify-position-locked-player-identity.mjs
          git diff --exit-code
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check client and server
        run: npx tsc --noEmit
