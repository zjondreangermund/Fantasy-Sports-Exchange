name: API-Football cutout portraits (safe batches)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Verified active Premier League players per batch (1-100)"
        required: false
        default: "100"
  schedule:
    # Catch up the current EPL player directory in small sequential batches.
    # Any unsupported or placeholder player falls back to their official photo.
    - cron: "23 2,8,14,20 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-football-cutout-portraits.yml"
      - "scripts/generate-player-cutouts.py"
      - "server/routes/epl.routes.ts"

permissions:
  contents: write

concurrency:
  group: cutout-portraits-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache portrait segmentation model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: api-football-cutout-isnet-general-use-v1
      - name: Install CPU-only image dependencies
        run: |
          python -m pip install --disable-pip-version-check "rembg[cpu]>=2.0.67,<3" "Pillow>=10,<13"
          python -m py_compile scripts/generate-player-cutouts.py
      - name: Fetch and validate verified current squad list
        run: |
          python - <<'PY'
          import json, time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from pathlib import Path
          path = "/api/leagues/premier-league/cutout-portrait-sources"
          hosts = [
              "https://playfantasyarena.com",
              "https://fantasy-sports-exchange-production-d05c.up.railway.app",
          ]
          result_file = Path("/tmp/verified-epl-player-portraits.json")
          for attempt in range(4):
              for host in hosts:
                  url = host + path
                  try:
                      request = Request(url, headers={"Accept":"application/json", "User-Agent":"FantasyArena-CutoutBot/1.0"})
                      with urlopen(request, timeout=22) as response:
                          payload = json.load(response)
                      players = payload.get("players") if isinstance(payload, dict) else None
                      if payload.get("provider") == "api-football" and isinstance(players, list) and len(players) >= 100:
                          result_file.write_text(json.dumps(payload), encoding="utf-8")
                          print("Verified source ready:", host, "players:", len(players))
                          break
                      print("Invalid verified source:",host,"count:",len(players) if isinstance(players,list) else 0)
                  except HTTPError as exc:
                      body = exc.read(350).decode("utf-8", "replace")
                      print("HTTP",exc.code,"at",host,"body:",body[:250],flush=True)
                  except (URLError, OSError, ValueError, TimeoutError) as exc:
                      print("Source fetch failed:",host,type(exc).__name__,str(exc)[:160],flush=True)
              if result_file.exists():
                  break
              if attempt != 3:
                  time.sleep(15)
          if not result_file.exists():
              raise RuntimeError("Verified squad source unavailable on both domains (see HTTP diagnostics). No portraits overwritten.")
          PY
      - name: Generate next transparent portrait batch
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: |
          python scripts/generate-player-cutouts.py --source-file /tmp/verified-epl-player-portraits.json --batch-size "$BATCH_SIZE"
      - name: Publish only passing cutouts and batch manifest
        run: |
          git config user.name "fantasy-arena-portrait-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/portraits/cutouts/
          if git diff --cached --quiet; then
            echo "No new portraits to publish."
            exit 0
          fi
          git commit -m "assets: publish next verified API-Football cutout portrait batch [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
