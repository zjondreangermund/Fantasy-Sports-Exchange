name: Current gameweek regression

on:
  push:
    branches: [main]
    paths:
      - "client/src/lib/arena-current-gameweek.ts"
      - "client/src/components/native/NativeHomePage.tsx"
      - "client/src/components/native/NativePlayPage.tsx"
      - "server/routes.ts"
      - "server/seed.ts"
      - "server/services/archiveConfirmedTestTournaments.ts"
      - "scripts/verify-current-arena-week.mjs"
      - ".github/workflows/current-gameweek-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-week:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regression — GW7 featured instead of legacy GW29
        run: node --import tsx scripts/verify-current-arena-week.mjs
      - name: TypeScript compile check
        run: npm run check
