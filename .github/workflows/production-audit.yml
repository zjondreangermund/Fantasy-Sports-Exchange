name: Production audit validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/production-audit-repair

permissions:
  contents: write

concurrency:
  group: production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, builds and critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply audit TypeScript repairs
        if: github.head_ref == 'agent/typescript-ci-diagnostics'
        run: |
          node scripts/fix-typescript-errors.mjs
          if git diff --quiet; then
            echo "No TypeScript source repairs required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src server scripts
            git commit -m "Fix remaining TypeScript errors [skip-autofix]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply production auth hardening
        if: github.head_ref == 'agent/auth-production-hardening'
        run: |
          node scripts/apply-auth-production-hardening.mjs
          if git diff --quiet; then
            echo "Production auth hardening already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .env.example README.md server scripts
            git commit -m "Harden production authentication and API logging [skip-autofix]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply Prize Vault image-only cards
        if: github.head_ref == 'agent/prize-vault-image-only-cards'
        run: |
          node scripts/apply-prize-vault-image-only.mjs
          if git diff --quiet; then
            echo "Prize Vault image-only cards already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/public client/src scripts
            git commit -m "Remove Prize Vault image wrapper blocks [skip-autofix]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply verified player profile repairs
        if: github.head_ref == 'agent/verified-player-profiles-sidebar-modal'
        run: |
          node scripts/apply-verified-player-profiles.mjs
          node scripts/apply-card-profile-provider-integration-v2.mjs
          if git diff --quiet; then
            echo "Verified player profile repairs already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/public client/src server scripts
            git commit -m "Verify card identities, stats and profile modal [skip-autofix]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply API-Football free-plan squad fallback
        if: github.head_ref == 'agent/api-football-free-plan-squad-fallback'
        run: |
          node scripts/apply-api-football-free-plan-fallback.mjs
          if git diff --quiet; then
            echo "API-Football free-plan squad fallback already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/services scripts
            git commit -m "Support current player photos on API-Football free plan [skip-autofix]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply complete current-squad photo sync
        if: github.head_ref == 'agent/complete-current-squad-photos'
        run: |
          node scripts/apply-complete-current-squad-photos.mjs
          node scripts/fix-complete-squad-sync-status-type.mjs
          if git diff --quiet; then
            echo "Complete current-squad photo sync already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/services scripts
            git commit -m "Complete current Premier League squad photo sync [skip-autofix]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply marketplace card profiles and verified stats
        if: github.head_ref == 'agent/marketplace-card-profiles'
        run: |
          node scripts/apply-marketplace-card-profiles.mjs
          if git diff --quiet; then
            echo "Marketplace card profile integrity already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src server scripts
            git commit -m "Open verified card profiles across the marketplace [skip-autofix]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Generated-source TypeScript check
        id: typescript
        shell: bash
        run: |
          set +e
          (npm run build:client && npx tsc --project tsconfig.json) 2>&1 | tee typescript-errors.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typescript-errors.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on TypeScript errors
        if: steps.typescript.outputs.exit_code != '0'
        run: exit 1

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Verify critical flows
        id: critical
        shell: bash
        run: |
          set +e
          {
            npm run test:critical-flows &&
            node --check scripts/prepare-runtime-startup.mjs &&
            node --check scripts/reconcile-production-card-inventory-v2.mjs &&
            node scripts/verify-epl-card-inventory-reconciliation.mjs &&
            node --check scripts/apply-reconcile-supply-overflow-fix.mjs &&
            node scripts/apply-reconcile-supply-overflow-fix.mjs &&
            node --check scripts/reconcile-production-card-inventory-v2.mjs &&
            node scripts/verify-reconcile-supply-overflow-fix.mjs &&
            node --check scripts/sync-official-tournaments.mjs &&
            node scripts/verify-runtime-boot-recovery.mjs &&
            node scripts/verify-tournament-lineup-integrity.mjs &&
            node scripts/verify-tournament-scoring-legal-integrity.mjs &&
            node scripts/verify-route-ownership-integrity.mjs &&
            node scripts/verify-auth-production-integrity.mjs &&
            node scripts/verify-card-data-integrity.mjs &&
            node scripts/verify-marketplace-profile-integrity.mjs &&
            node scripts/verify-prize-vault-funding.mjs &&
            node scripts/verify-unified-scroll-architecture.mjs &&
            node scripts/verify-collection-actions-dialog.mjs &&
            node scripts/verify-verified-player-profiles.mjs &&
            node scripts/verify-strict-player-identity-fixtures.mjs &&
            node scripts/verify-api-football-player-images.mjs &&
            node scripts/verify-api-football-free-plan-fallback.mjs &&
            node scripts/verify-complete-current-squad-photos.mjs &&
            node scripts/verify-deposit-flows.mjs &&
            node scripts/verify-withdrawal-flows.mjs &&
            node scripts/verify-wallet-reconciliation.mjs &&
            node scripts/verify-wallet-bypass-removal.mjs &&
            node scripts/verify-wallet-posting-integrity.mjs &&
            node scripts/verify-loan-payment-integrity.mjs &&
            node scripts/verify-forge-operation-integrity.mjs &&
            node scripts/verify-production-readiness.mjs
          } 2>&1 | tee critical-flow-errors.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload critical-flow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-flow-diagnostics
          path: critical-flow-errors.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on critical-flow errors
        if: steps.critical.outputs.exit_code != '0'
        run: exit 1
