    <style>
      @media (min-width: 1024px) {
        div:has(> button[data-testid^="premium-football-card-"]) {
          margin-bottom: -11.25rem !important;
        }
        div:has(> button[data-testid^="premium-football-card-"]) + div {
          margin-top: 0 !important;
          transform: translateY(-2.35rem) !important;
        }
        button[data-testid^="premium-football-card-"] img {
          opacity: 1 !important;
          filter: saturate(1.34) contrast(1.18) brightness(1.18) drop-shadow(0 22px 20px rgba(0,0,0,.56)) drop-shadow(0 0 18px rgba(255,255,255,.42)) !important;

  <body>
    <div id="root"></div>
    <!-- A successful Railway deployment does not guarantee a WebView started.
         Native APK users get a visible recovery choice instead of a blank screen. -->
    <div id="native-startup-recovery" hidden role="alert" aria-live="polite" style="position:fixed;inset:0;z-index:2147483647;background:#050817;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif;text-align:center;">
      <div style="width:100%;max-width:380px;padding:28px 22px;border:1px solid #414077;border-radius:24px;background:#11152a">
        <div style="font-size:32px;margin-bottom:12px">⚽</div>
        <h1 style="font-size:23px;margin:0 0 10px">Fantasy Arena</h1>
        <p style="font-size:14px;line-height:1.65;color:#cbd5e1;margin:0 0 20px">The app screen did not finish loading. Your cards and tournament progress are saved online.</p>
        <button id="native-startup-retry" type="button" style="width:100%;padding:13px;border:0;border-radius:12px;background:#22d3ee;color:#07111d;font-weight:800">Reload Arena</button>
        <a href="https://playfantasyarena.com/" target="_blank" rel="noopener noreferrer" style="display:block;margin-top:17px;font-size:13px;color:#c4b5fd">Open website in browser</a>
      </div>
    </div>
    <style>#native-startup-recovery[hidden]{display:none!important}</style>
    <script>
      (function () {
        // Only the installed Capacitor Android shell uses this fallback.
        if (!(navigator.userAgent || "").includes("FantasyArenaNative/")) return;
        var root = document.getElementById("root");
        var recovery = document.getElementById("native-startup-recovery");
        var retry = document.getElementById("native-startup-retry");
        if (!root || !recovery || !retry) return;
        var recovered = false;
        function hasApp() { return root.children.length > 0 || Boolean(root.textContent.trim()); }
        function checkBoot() {
          if (hasApp()) { recovery.hidden = true; recovered = true; return; }
          if (!recovered) recovery.hidden = false;
        }
        var observer = new MutationObserver(function () { if (hasApp()) { recovery.hidden = true; recovered = true; observer.disconnect(); } });
        observer.observe(root, { childList: true, subtree: false });
        window.setTimeout(checkBoot, 12000);
        // Any stale service-worker cache is removed only if the user chooses Retry;
        // no automatic reload loops and no clearing login or local storage.
        retry.addEventListener("click", async function () {
          retry.disabled = true;
          retry.textContent = "Reloading…";
          try {
            if ("serviceWorker" in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(function (item) { return item.unregister(); }));
            }
            if ("caches" in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }
          } catch (error) { /* Continue the reload if cache cleanup is unavailable. */ }
          var url = new URL(window.location.href);
          url.searchParams.set("nativeReload", String(Date.now()));
          window.location.replace(url.toString());
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
