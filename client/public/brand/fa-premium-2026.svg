<svg xmlns="http://www.w3.org/2000/svg" width="512" height="590" viewBox="0 0 512 590" role="img" aria-labelledby="title desc">
  <title id="title">Fantasy Arena</title>
  <desc id="desc">Crowned lion Fantasy Arena brand with purple and blue neon accents.</desc>
  <defs>
    <linearGradient id="arena" x1="110" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d62cff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22a7ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#168cff" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="590" rx="42" fill="#000"/>
  <image href="fantasy-arena-icon.svg" x="64" y="20" width="384" height="384" preserveAspectRatio="xMidYMid meet" filter="url(#glow)"/>
  <text x="256" y="448" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="4">FANTASY</text>
  <text x="256" y="516" text-anchor="middle" fill="url(#arena)" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="9">ARENA</text>
  <text x="256" y="558" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="5">PLAY • COMPETE • WIN</text>
</svg>
